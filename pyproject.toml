[project]
name = "django-mvp-bits"
version = "0.0.1"
description = "Configurable page blocks for django-mvp projects: heroes, sections, calls to action"
authors = [
    { name = "Samuel Jennings", email = "samuel.scott.jennings@gmail.com" },
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12,<4.0"
# django-mvp is a hard dependency, not an integration. Every component here is
# markup over the classes django-mvp's stylesheet ships, and the supplementary
# stylesheet in this package deliberately omits everything django-mvp already
# emits. Without it loaded first, these components have no styling at all.
dependencies = ["django>=5.2", "django-mvp>=0.23.0"]
keywords = ["django", "tailwind", "daisyui", "components", "landing-page", "cotton"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]

[project.urls]
Homepage = "https://github.com/django-mvp/django-mvp-bits"
Repository = "https://github.com/django-mvp/django-mvp-bits"
Issues = "https://github.com/django-mvp/django-mvp-bits/issues"

[tool.poetry]
packages = [{ include = "mvp_bits" }]
requires-poetry = '>=2.0,<3.0'

# django-cotton is deliberately absent from the dependency list. django-mvp
# pins it exactly (==2.6.1); a second constraint here could only ever fight
# that one, and this package has no say in which version a project runs.

[tool.poetry.group.dev.dependencies]
# Family toolchain bundle; the pin tag is the family-standard version. Ships
# ruff, mypy, deptry, pre-commit, pytest, pytest-django, coverage, django-stubs.
mvp-shared = { git = "https://github.com/django-mvp/shared.git", tag = "v0.4.1", extras = [
    "dev",
    "test",
] }

[build-system]
requires = ['poetry-core (>=2.0,<3.0)']
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = [".", "tests"]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
    "-ra",
]

[tool.coverage.report]
skip_empty = true
show_missing = true

[tool.coverage.run]
branch = true
source = ["mvp_bits"]

[tool.djlint]
profile = "django"
indent = 2
preserve_leading_space = true
preserve_blank_lines = true
format_attribute_template_tags = true
format_css = true
format_js = true
max_line_length = 120
max_attribute_length = 70
include = "H006,H013,H020,H021,H023,H025,H030,H031"
ignore = "H017"
extension = "html"

# Lint and format are both ruff's: it replaces black (formatting), isort (the I
# rules) and pyupgrade (the UP rules), so those three no longer appear here.
# The family rule set lives in ruff-base.toml, which is copied in rather than
# referenced remotely — `extend` only accepts a local path.
[tool.ruff]
extend = "ruff-base.toml"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "B017", "A001", "RUF059"]
# The example project is a demonstration target, never deployed: its settings
# carry a literal SECRET_KEY on purpose.
"example/*" = ["S101", "S105", "S106"]

[tool.mypy]
files = ["mvp_bits"]
disallow_untyped_defs = "False"
disallow_any_unimported = "False"
ignore_missing_imports = "True"
no_implicit_optional = "True"
check_untyped_defs = "False"
warn_return_any = "True"
warn_unused_ignores = "True"
show_error_codes = "True"
exclude = ["docs/", "migrations/", "tests/settings.py"]
mypy_path = "mvp_bits/"
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "tests.settings"
ignore_missing_model_attributes = "True"

[tool.forge.conformance]
# Neither of these test modules has a source module to mirror, and neither
# should. test_app.py's subject is the Django app registry and the layout of the
# installed package; test_stylesheet.py's subject is a built CSS artifact and the
# class tokens in the templates. Conforming to the mirror rule would mean
# inventing mvp_bits/app.py and mvp_bits/stylesheet.py purely to give two test
# files something to point at.
non-mirror-paths = ["tests/test_app.py", "tests/test_stylesheet.py"]

[tool.deptry]
extend_exclude = ["tests/", "example/", "docs/"]

[tool.deptry.per_rule_ignores]
# django-mvp is a real runtime dependency that no Python module here imports.
# This package's dependence on it is at the template and stylesheet level: its
# components render daisyUI markup django-mvp's stylesheet defines, and the
# stylesheet shipped here deliberately omits everything django-mvp already
# emits. Dropping the dependency would leave every component unstyled while
# every import still resolved.
DEP002 = ["django-mvp"]
