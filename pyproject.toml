[project]
name = "daisy-cotton-blocks"
version = "0.0.1"
description = "Configurable page blocks for django-cotton and daisyUI: heroes, sections, calls to action"
authors = [
    { name = "Samuel Jennings", email = "samuel.scott.jennings@gmail.com" },
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12,<4.0"
# The host supplies daisyUI and its active theme, by whatever means it likes.
# This package renders daisyUI markup and ships the plain Tailwind utilities
# that markup needs, so the only code dependency is Cotton itself.
dependencies = ["django>=5.2", "django-cotton>=2.6"]
keywords = ["django", "tailwind", "daisyui", "components", "landing-page", "cotton"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]

[project.urls]
Homepage = "https://github.com/django-mvp/daisy-cotton-blocks"
Repository = "https://github.com/django-mvp/daisy-cotton-blocks"
Issues = "https://github.com/django-mvp/daisy-cotton-blocks/issues"

[tool.poetry]
packages = [{ include = "daisy_cotton_blocks" }]
requires-poetry = '>=2.0,<3.0'

[tool.poetry.group.dev.dependencies]
# Family toolchain bundle; the pin tag is the family-standard version. Ships
# ruff, mypy, deptry, pre-commit, pytest, pytest-django, coverage, django-stubs.
mvp-shared = { git = "https://github.com/django-mvp/shared.git", tag = "v0.4.1", extras = [
    "dev",
    "test",
] }

# A host for the example project and the coverage test: django-mvp is one
# ready-made daisyUI and Cotton host, which is all the demo needs it to be.
django-mvp = ">=0.23.0"

[build-system]
requires = ['poetry-core (>=2.0,<3.0)']
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = [".", "tests"]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
    "-ra",
]

[tool.coverage.report]
skip_empty = true
show_missing = true

[tool.coverage.run]
branch = true
source = ["daisy_cotton_blocks"]

[tool.djlint]
profile = "django"
indent = 2
preserve_leading_space = true
preserve_blank_lines = true
format_attribute_template_tags = true
format_css = true
format_js = true
max_line_length = 120
max_attribute_length = 70
include = "H006,H013,H020,H021,H023,H025,H030,H031"
ignore = "H017"
extension = "html"

# Lint and format are both ruff's: it replaces black (formatting), isort (the I
# rules) and pyupgrade (the UP rules), so those three no longer appear here.
# The family rule set lives in ruff-base.toml, which is copied in rather than
# referenced remotely — `extend` only accepts a local path.
[tool.ruff]
extend = "ruff-base.toml"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "B017", "A001", "RUF059"]
# The example project is a demonstration target, never deployed: its settings
# carry a literal SECRET_KEY on purpose.
"example/*" = ["S101", "S105", "S106"]

[tool.mypy]
files = ["daisy_cotton_blocks"]
disallow_untyped_defs = "False"
disallow_any_unimported = "False"
ignore_missing_imports = "True"
no_implicit_optional = "True"
check_untyped_defs = "False"
warn_return_any = "True"
warn_unused_ignores = "True"
show_error_codes = "True"
exclude = ["docs/", "migrations/", "tests/settings.py"]
mypy_path = "daisy_cotton_blocks/"
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "tests.settings"
ignore_missing_model_attributes = "True"

[tool.forge.conformance]
# Neither of these test modules has a source module to mirror, and neither
# should. test_app.py's subject is the Django app registry and the layout of the
# installed package; test_stylesheet.py's subject is a built CSS artifact and the
# class tokens in the templates. Conforming to the mirror rule would mean
# inventing daisy_cotton_blocks/app.py and daisy_cotton_blocks/stylesheet.py purely to give two test
# files something to point at.
non-mirror-paths = ["tests/test_app.py", "tests/test_stylesheet.py"]

[tool.deptry]
extend_exclude = ["tests/", "example/", "docs/"]

[tool.deptry.per_rule_ignores]
# django-cotton is a real runtime dependency that no Python module here imports.
# Every block is a Cotton component, so the dependence is at the template layer:
# without Cotton installed and in INSTALLED_APPS, a <c-hero.centred> tag renders
# as literal text while every Python import still resolves.
DEP002 = ["django-cotton"]
