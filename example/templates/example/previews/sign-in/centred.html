{% extends "example/preview_base.html" %}

{% block preview %}

    <c-slot name="background"><c-background.aurora /></c-slot>
    <c-slot name="logo"><c-demo.logo /></c-slot>
    <c-slot name="providers"><c-demo.auth.providers /></c-slot>
    <c-demo.auth.sign-in-form :state="state" />

  </c-sign-in.centred>
{% endblock preview %}
