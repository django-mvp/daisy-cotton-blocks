{% extends "example/preview_base.html" %}

{% block preview %}
  <c-sign-in.split title="Welcome back" lead="Sign in to see what shipped while you were away.">
    <c-slot name="logo"><c-demo.logo /></c-slot>
    <c-slot name="providers"><c-demo.auth.providers passkey /></c-slot>
    <c-demo.auth.sign-in-form :state="state" />
    <c-slot name="footer">No account yet? <a class="link" href="#">Create one</a></c-slot>
    <c-slot name="background"><c-background.grid /></c-slot>
    <c-slot name="aside">
      <figure class="flex max-w-lg flex-col gap-6">
        <blockquote class="text-3xl leading-snug font-medium dce:text-balance">
          “We stopped asking whether a change had gone out. Meridian had already told everyone.”
        </blockquote>
        <c-quote.byline invert name="Priya Raman" role="Platform lead at Northwind" />
      </figure>
    </c-slot>
  </c-sign-in.split>
{% endblock preview %}
