{# @description One cell of the background gallery: a live block above the line, its markup below. #}
{# @prop markup:text | description:"The escaped markup shown under the live block" #}
{# @slot A hero block — The live block to show. #}
<c-vars markup />
<div class="flex min-w-0 flex-col overflow-clip rounded-xl ring-1 ring-base-300">
  <div class="flex-1">{{ slot }}</div>
  <div class="border-t border-base-300 bg-base-200 p-3">
    <code class="text-xs">{{ markup }}</code>
  </div>
</div>
